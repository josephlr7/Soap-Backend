server:
  port: 8085

spring:
  application:
    name: NovaMarket-Backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/novamarket_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: cliente
    password: ${NOVAMARKET_DB_PASSWORD:nova}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
novamarket:
  admin:
    password: ${NOVAMARKET_ADMIN_PASSWORD:}
  soap-url: http://localhost:8090/ws/NovaMarketFacturacion
  api-peru:
    base-url: https://api.apiperu.dev
    token: ${APIPERU_TOKEN:}

